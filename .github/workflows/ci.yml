name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  install:
    name: Install
    if: github.event_name == 'push' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: node_modules/playwright-core/.local-browsers
          key: browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browsers-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install Chromium
        run: pnpm browsers:install

  types:
    name: Types
    needs: install
    if: ${{ (github.event_name == 'push' || github.event.action != 'edited') && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck

  lint:
    name: Lint
    needs: install
    if: ${{ (github.event_name == 'push' || github.event.action != 'edited') && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  content:
    name: Content
    needs: install
    if: ${{ (github.event_name == 'push' || github.event.action != 'edited') && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Content
        run: pnpm content:check

  tests:
    name: Tests
    needs: install
    if: ${{ (github.event_name == 'push' || github.event.action != 'edited') && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: node_modules/playwright-core/.local-browsers
          key: browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browsers-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install Chromium
        run: pnpm browsers:install
      - name: Test
        run: pnpm test

  build:
    name: Build
    needs: install
    if: ${{ (github.event_name == 'push' || github.event.action != 'edited') && needs.install.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    needs: [install, build]
    if: ${{ (github.event_name == 'push' || github.event.action != 'edited') && needs.install.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          run_install: false
      - uses: actions/cache@v6
        with:
          path: .pnpm-store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: node_modules/playwright-core/.local-browsers
          key: browsers-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browsers-${{ runner.os }}-
          fail-on-cache-miss: false
      - name: Install Chromium
        run: pnpm browsers:install
      - name: End-to-end
        run: pnpm test:e2e

  title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TITLE" > "$RUNNER_TEMP/pr-title.txt"
          node tools/check-commit-msg.mjs "$RUNNER_TEMP/pr-title.txt"
