name: pnpm
description: Install the pnpm version pinned by packageManager

runs:
  using: composite
  steps:
    - name: Install pinned pnpm
      shell: bash
      run: |
        set -euo pipefail
        spec="$(node -p "require('./package.json').packageManager")"
        case "$spec" in
          pnpm@*) version="${spec#pnpm@}" ;;
          *)
            echo "packageManager must start with pnpm@, got: $spec" >&2
            exit 1
            ;;
        esac
        case "$(uname -m)" in
          x86_64) asset="pnpm-linux-x64.tar.gz" ;;
          aarch64 | arm64) asset="pnpm-linux-arm64.tar.gz" ;;
          *)
            echo "unsupported arch: $(uname -m)" >&2
            exit 1
            ;;
        esac
        dir="${RUNNER_TEMP}/pnpm"
        mkdir -p "$dir"
        curl -fsSL -o "$dir/pnpm.tar.gz" "https://github.com/pnpm/pnpm/releases/download/v${version}/${asset}"
        tar -xzf "$dir/pnpm.tar.gz" -C "$dir"
        rm "$dir/pnpm.tar.gz"
        if [[ ! -x "$dir/pnpm" || ! -d "$dir/dist" ]]; then
          echo "pnpm archive did not contain pnpm and dist/ as siblings" >&2
          exit 1
        fi
        echo "$dir" >> "$GITHUB_PATH"
        actual="$("$dir/pnpm" --version)"
        if [[ "$actual" != "$version" ]]; then
          echo "pnpm $actual does not match packageManager $version" >&2
          exit 1
        fi
        echo "pnpm $actual"
